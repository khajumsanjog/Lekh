name: Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create/update release for (e.g. v0.1.0)"
        required: false
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.tag.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve tag name
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag_name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=${{ inputs.tag || 'v0.1.0' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release entry immediately
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "Lekh ${{ steps.tag.outputs.tag_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: install.ps1
          body: |
            Precompiled binaries (`lk` and `lekh`) and installers for **Windows (x86_64)**, **macOS (Apple Silicon)**, and **Linux (x86_64)**.

            ### Quick Setup on Windows (PowerShell & `cmd.exe` — No Cargo Needed)
            **Option 1 — One-Line PowerShell Setup (Recommended, avoids browser SmartScreen):**
            ```powershell
            irm https://github.com/khajumsanjog/Lekh/releases/latest/download/install.ps1 | iex
            ```
            **Option 2 — Windows Installer (`lekh-windows-x86_64-setup.exe`):**
            Download and run **`lekh-windows-x86_64-setup.exe`** below. It installs **both** `lk.exe` and `lekh.exe` and automatically adds them to your Windows `PATH` so you can run `lk index.html` or `lekh index.html` in PowerShell, Windows Terminal, and `cmd.exe`.

            ### Quick Install (macOS)
            ```sh
            tar -xzf lekh-macos-arm64.tar.gz
            xattr -d com.apple.quarantine lk lekh 2>/dev/null || true
            chmod +x lk lekh
            sudo mv lk lekh /usr/local/bin/
            lk --version
            ```

            ### Quick Install (Linux)
            ```sh
            tar -xzf lekh-linux-x86_64.tar.gz
            sudo install -m 755 lk lekh /usr/local/bin/
            lk --version
            ```

            Licensed under the [MIT License](https://github.com/khajumsanjog/Lekh/blob/main/LICENSE).

  build-and-upload:
    name: Build & Attach (${{ matrix.asset_name }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: lekh-macos-arm64
            archive: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: lekh-linux-x86_64
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: lekh-windows-x86_64
            archive: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable MSVC SDK tools (rc.exe & signtool.exe) on Windows
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binaries
        env:
          LEKH_PUBLISHER: "khajumsanjog"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Sign Windows binaries (if WINDOWS_PFX_BASE64 secret is configured)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:PFX_B64)) {
            $pfxPath = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:PFX_B64))
            signtool.exe sign /f $pfxPath /p $env:PFX_PASS /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
              "target/${{ matrix.target }}/release/lk.exe" `
              "target/${{ matrix.target }}/release/lekh.exe"
            Remove-Item -Force $pfxPath -ErrorAction SilentlyContinue
          }

      - name: Package Unix archive (.tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/lk" dist/
          cp "target/${{ matrix.target }}/release/lekh" dist/
          cp README.md LICENSE dist/
          tar -czf "${{ matrix.asset_name }}.tar.gz" -C dist lk lekh README.md LICENSE

      - name: Package Windows archive (.zip) & Setup Installer (.exe)
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/lk.exe" dist/
          Copy-Item "target/${{ matrix.target }}/release/lekh.exe" dist/
          Copy-Item install.ps1, README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.asset_name }}.zip" -Force

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "installer\windows\lekh.iss"

          if (-not [string]::IsNullOrWhiteSpace($env:PFX_B64)) {
            $pfxPath = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:PFX_B64))
            signtool.exe sign /f $pfxPath /p $env:PFX_PASS /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
              "dist-installer\lekh-windows-x86_64-setup.exe"
            Remove-Item -Force $pfxPath -ErrorAction SilentlyContinue
          }

      - name: Attach Unix archive to GitHub Release
        if: matrix.archive == 'tar.gz'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          files: ${{ matrix.asset_name }}.tar.gz

      - name: Attach Windows Installer & Zip to GitHub Release
        if: matrix.archive == 'zip'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          files: |
            dist-installer/lekh-windows-x86_64-setup.exe
            ${{ matrix.asset_name }}.zip
