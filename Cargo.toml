[package]
name = "lekh"
version = "0.1.0"
edition = "2021"
description = "Lekh (lk): a fast, small and safe terminal text editor"
license = "MIT"
rust-version = "1.74"

# Two commands from one code base:
#   lekh FILE   (src/main.rs)
#   lk FILE     (src/bin/lk.rs)

[dependencies]
crossterm = "0.28"
unicode-width = "0.1"

[profile.release]
opt-level = "s"      # small and fast; an editor is never CPU-bound
lto = true
codegen-units = 1
strip = true
panic = "abort"      # the panic hook restores the terminal first
